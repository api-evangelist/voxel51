description: >-
  FinOps view of Voxel51 / FiftyOne spend. FiftyOne open source is free
  (Apache-2.0) and runs on the customer's own infrastructure, so direct cost is
  the underlying compute, storage, and database (e.g., MongoDB) the team
  operates. FiftyOne Enterprise is a sales-led subscription priced by user
  seats, VPUs, and monthly compute hours across Team / Growth / Custom tiers,
  with negotiated terms rather than published per-token rates.
notes: >-
  Open-source costs are indirect (self-hosted compute/storage). Enterprise
  costs are contracted subscription commitments; no public unit rates are
  published. Verify metering and entitlements with Voxel51 during
  reconciliation.
