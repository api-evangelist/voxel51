meters:
- name: user_seats
  description: Licensed FiftyOne Enterprise user seats per contracted tier.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - tier
- name: vpus
  description: Visual processing units (VPUs) provisioned for the Enterprise deployment.
  unit: vpus
  aggregation: max
  dimensions:
  - account
  - tier
- name: compute_hours
  description: Monthly compute hours consumed by Enterprise workloads against the tier entitlement.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - tier
- name: self_hosted_infrastructure
  description: Underlying compute, storage, and database cost for self-operated open-source FiftyOne (indirect, billed by the cloud/infra provider, not Voxel51).
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - resource
principles:
- name: Visibility
  description: Separate free open-source self-hosting cost (cloud compute/storage/MongoDB) from the Voxel51 Enterprise subscription.
- name: Allocation
  description: Map Enterprise seats, VPUs, and compute hours to teams/projects; tag self-hosted infra by workload.
- name: Optimization
  description: Use free open-source FiftyOne where Enterprise governance is not required; right-size VPUs and compute-hour entitlements to actual usage.
- name: Accountability
  description: Review seat utilization and compute-hour burn against the contracted tier each renewal cycle.
