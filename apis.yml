name: Voxel51
kind: company
description: Voxel51 builds FiftyOne, the open-source toolkit for building high-quality
  computer-vision and multimodal datasets and models. FiftyOne's primary interface
  is a Python SDK (datasets, samples, views, and the FiftyOne App) rather than a broad
  public REST API. FiftyOne Enterprise adds a Management SDK and an authenticated API
  connection that lets the SDK operate over the network instead of a direct database
  connection.
