  description: The open-source FiftyOne Python SDK is the primary interface for building
    and curating visual AI datasets - creating Datasets and Samples, slicing data with
    Views and aggregations, computing embeddings and similarity, running evaluations,
    and launching the interactive FiftyOne App. Distributed via pip (Apache-2.0); it
    is a Python library, not a remote REST API.
- aid: voxel51:fiftyone-enterprise-management-sdk
  name: FiftyOne Enterprise Management SDK / API
  tags:
  - Enterprise
  - Management SDK
  - API Connection
  - Administration
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.voxel51.com/enterprise/management_sdk.html
  baseURL: ''
  properties:
  - url: https://docs.voxel51.com/enterprise/management_sdk.html
    type: Documentation
  - url: https://docs.voxel51.com/enterprise/api_connection.html
    type: APIReference
  - url: openapi/_original/voxel51-openapi.yml
    type: OpenAPI
  - url: https://github.com/voxel51/fiftyone
    type: GitHub
  description: FiftyOne Enterprise (formerly Teams) adds the fiftyone.management Python
    module for administering users, service accounts, API keys, dataset permissions,
    user groups, and cloud credentials. It operates over an authenticated API connection
    (FIFTYONE_API_URI + FIFTYONE_API_KEY) so SDK calls run against the central FiftyOne
    Enterprise API rather than a direct MongoDB connection. The wire protocol is an
    internal GraphQL/orchestration surface consumed by the SDK; Voxel51 does not publish
    a general-purpose public REST API contract.
