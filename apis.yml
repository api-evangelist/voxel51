  description: The plugin and operator framework extends FiftyOne with custom Python
    (and JavaScript/React) functionality - new App panels, operators, and integrations
    that run inside the FiftyOne App and SDK. Plugins are authored against the FiftyOne
    Python/JS APIs and registered with the local or Enterprise deployment; they are
    not exposed as a standalone public HTTP API.
