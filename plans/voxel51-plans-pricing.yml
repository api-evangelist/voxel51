specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Voxel51
providerId: voxel51
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- AI
- Computer Vision
- Datasets
- Machine Learning
- Python SDK
- Plans
description: >-
  FiftyOne open source is free and licensed under Apache-2.0, installed via pip
  and run locally with no metered API. FiftyOne Enterprise (formerly Teams) is
  sold sales-led across Team, Growth, and Custom tiers, sized by user seats,
  VPUs (visual processing units), and monthly compute hours, with "Contact
  sales" pricing rather than published list prices. Specific dollar figures are
  not published and are not reconciled in this artifact.
notes: >-
  Open source is free (Apache-2.0). Enterprise tier capacities below
  (seats / VPUs / compute hours) are as advertised on the pricing page and may
  change; verify with Voxel51 sales during reconciliation. No public per-unit
  list prices are published for Enterprise.
sources:
- https://voxel51.com/pricing
- https://github.com/voxel51/fiftyone
- https://docs.voxel51.com/enterprise/index.html
plans:
- id: voxel51-open-source
  name: FiftyOne Open Source
  type: free
  description: >-
    Free, Apache-2.0 licensed FiftyOne Python SDK and App. Installed via pip
    and run locally; no remote metered API, no seat charges.
  entries:
  - label: FiftyOne Open Source
    name: open_source
    type: free
    metric: license
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0 (Apache-2.0)
    userMultiplied: false
  elements:
  - name: FiftyOne Python SDK
  - name: FiftyOne App
  - name: Plugins & Operators
- id: voxel51-team
  name: Team
  type: enterprise
  description: >-
